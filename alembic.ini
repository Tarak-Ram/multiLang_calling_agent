[alembic]
script_location = migrations
prepend_sys_path = .
# URL is taken from DATABASE_URL via migrations/env.py (never hard-coded here).

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
